<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="min-h-screen flex flex-col">
    <nav class="bg-blue-500 w-full py-6 px-12">
      <div class="flex items-center justify-between">
        <a href="/index.html">ALGUMACOISA-STORE</a>

        <ul class="style-none flex gap-4">
          <li>
            <button
              class="border border-white/10 bg-white/5 p-2 rounded-full flex items-center justify-center cursor-pointer"
            >
              <img src="/assets/images/moon.svg" alt="Carrinho de Compras" />
            </button>
          </li>
          <li>
            <button
              id="cart-button"
              class="relative border border-white/10 bg-white/5 p-2 rounded-full flex items-center justify-center cursor-pointer"
            >
              <img
                src="/assets/images/shopping-bag.svg"
                alt="Carrinho de Compras"
              />
            </button>
          </li>
        </ul>
      </div>
      <div
        id="cart-container"
        class="absolute hidden flex flex-col right-0 bg-black/70 border border-white/15 rounded-lg p-4 mr-12 mt-4 z-9999 h-[calc(100vh-8rem)] lg:h-90 lg:max-h-120 w-[calc(100vw-6rem)] lg:w-200"
      >
        <h2 class="text-white text-lg font-semibold mb-4">
          Carrinho de Compras
        </h2>

        <div id="cart-items" class="text-white overflow-y-auto flex-1 min-h-0">
          <section
            id="products-local-storage"
            class="flex flex-col gap-4 px-6"
          ></section>
        </div>

        <div class="flex flex-col items-end justify-center gap-2 mt-4">
          <span id="cart-total" class="text-white font-semibold">Total: R$ 0,00</span>
          <buttton class="bg-green-500 hover:bg-green-600 px-4 py-2 rounded-lg transition cursor-pointer">Finalizar compra</buttton>
      </div>
    </nav>
    <main class="flex-1 px-12 py-6">
      <h1 class="text-red-500">ALO</h1>

      <section
        id="products"
        class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4 md:px-12 xl:px-24"
      ></section>
      <h2>Produtos no Local Storage:</h2>
    </main>
    <footer class="bg-blue-500 w-full py-6 px-12">
      <div class="flex items-center justify-center">
        <span>&copy; 2026 ALGUMACOISA-STORE</span>
      </div>
    </footer>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
