<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link rel="stylesheet" href="./theme.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="min-h-screen flex flex-col bg-[var(--color-background)] text-[var(--color-text)]">
    <nav class="bg-blue-500 w-full py-6 px-12">
      <div class="flex items-center justify-between">
        <a href="/index.html">ALGUMACOISA-STORE</a>

        <ul class="style-none flex gap-4">
          <li>
            <button
            id="theme-button"
              class="border border-white/10 bg-white/5 p-2 rounded-full flex items-center justify-center cursor-pointer"
            >
              <img src="/assets/images/moon.svg" alt="Mudar tema" />
            </button>
          </li>
          <li>
            <button
              id="cart-button"
              class="relative border border-white/10 bg-white/5 p-2 rounded-full flex items-center justify-center cursor-pointer"
            >
              <img
                src="/assets/images/shopping-bag.svg"
                alt="Carrinho de Compras"
              />
            </button>
          </li>
        </ul>
      </div>
      <div
        id="cart-container"
        class="absolute hidden flex flex-col right-0 bg-[var(--color-overlay)] border border-white/15 rounded-lg p-4 mr-12 mt-4 z-9999 h-[calc(100vh-8rem)] lg:h-90 lg:max-h-120 w-[calc(100vw-6rem)] lg:w-200"
      >
        <h2 class="text-white text-lg font-semibold mb-4">
          Carrinho de Compras
        </h2>

        <div id="cart-items" class="text-white overflow-y-auto flex-1 min-h-0">
          <section
            id="products-local-storage"
            class="flex flex-col gap-4 px-6"
          ></section>
        </div>

        <div class="flex flex-col items-end justify-center gap-2 mt-4">
          <span id="cart-total" class="text-white font-semibold">Total: R$ 0,00</span>
          <a href="/checkout" class="bg-green-500 hover:bg-green-600 text-black px-4 py-2 rounded-lg transition cursor-pointer">Finalizar compra</a>
      </div>
    </nav>
    <main class="flex-1 px-12 py-6">
      <h1 class="text-red-500">Finalizar Compra</h1>

      <div class="flex flex-col md:flex-row itens-center justify-between md:px-16 lg:px-24 xl:px-40 py-12 gap-8">
<section class="md:w-1/2 bg-black/10 border border-white/15 px-6 py-6 md:px-8 rounded-md shadow-xl">
  <h2 class="text-3xl mb-6">Seus dados</h2>

  <form id="checkout-form" class="flex flex-col gap-5" novalidate>
    <div class="flex flex-col gap-2">
      <label for="customer-name">Nome completo</label>

      <input
        id="customer-name"
        name="customerName"
        type="text"
        autocomplete="name"
        placeholder="Seu nome completo"
        required
        aria-describedby="customer-name-error"
        class="w-full px-4 py-3 rounded-lg border border-[var(--color-border)] bg-[var(--color-surface)] text-[var(--color-text)] outline-none focus:ring-2 focus:ring-green-500"
      />

      <span
        id="customer-name-error"
        class="hidden rounded-md border border-red-500/40 bg-red-500/10 px-3 py-2 text-sm text-red-500"
        aria-live="polite"
      ></span>
    </div>

    <div class="flex flex-col gap-2">
      <label for="customer-email">E-mail</label>

      <input
        id="customer-email"
        name="customerEmail"
        type="email"
        autocomplete="email"
        placeholder="voce@exemplo.com"
        required
        aria-describedby="customer-email-error"
        class="w-full px-4 py-3 rounded-lg border border-[var(--color-border)] bg-[var(--color-surface)] text-[var(--color-text)] outline-none focus:ring-2 focus:ring-green-500"
      />
      
      <span
          id="customer-email-error"
          class="hidden rounded-md border border-red-500/40 bg-red-500/10 px-3 py-2 text-sm text-red-500"
          aria-live="polite"
      ></span>
    </div>

    <div class="flex flex-col gap-2">
      <label for="payment-method">Forma de pagamento</label>

      <select
        id="payment-method"
        name="paymentMethod"
        required
        aria-describedby="payment-method-error"
        class="w-full px-4 py-3 rounded-lg border border-[var(--color-border)] bg-[var(--color-surface)] text-[var(--color-text)] outline-none focus:ring-2 focus:ring-green-500"
      >
        <option value="" selected disabled>
          Selecione uma forma de pagamento
        </option>

        <option value="pix">PIX</option>
        <option value="credit-card">Cartão de crédito</option>
      </select>

      <span
        id="payment-method-error"
        class="hidden rounded-md border border-red-500/40 bg-red-500/10 px-3 py-2 text-sm text-red-500"
        aria-live="polite"
      ></span>
    </div>

    <div id="installments-container" class="hidden w-full flex flex-col gap-2">
      <label for="installments">Parcelas</label>

      <select
        id="installments"
        name="installments"
        disabled
        aria-describedby="installments-error"
        class="w-full px-4 py-3 rounded-lg border border-[var(--color-border)] bg-[var(--color-surface)] text-[var(--color-text)] outline-none focus:ring-2 focus:ring-green-500"
      >
        <option value="" selected disabled>
          Selecione a quantidade de parcelas
        </option>
      </select>

      <span
        id="installments-error"
        class="hidden w-full rounded-md border border-red-500/40 bg-red-500/10 px-3 py-2 text-sm text-red-500"
        aria-live="polite"
      ></span>

    </div>

    <p
      id="checkout-message"
      role="status"
      aria-live="polite"
      class="text-sm"
    ></p>

    <button
      type="submit"
      class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-4 rounded-lg transition cursor-pointer"
    >
      Finalizar compra
    </button>
  </form>
</section>

        <section class="md:w-1/2 bg-black/10 border border-white/15 px-6 md:px-12 py-3 md:px-8 rounded-md shadow-xl">
          <h2 class="text-3xl py-6">Itens a serem comprados</h2>
          <div id="checkout-cart-items" class="flex flex-col gap-4 px-6 overflow-y-auto h-120"></div>
          <span id="checkout-cart-total">
            Total: R$ 0,00
          </span>
       </section>
</div>
      
    </main>

    <footer class="bg-blue-500 w-full py-6 px-12">
      <div class="flex items-center justify-center">
        <span>&copy; 2026 ALGUMACOISA-STORE</span>
      </div>
    </footer>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
